
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B0B0B">
    <title>Thank You | EASYBLACK</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <style>
        .confirmation-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            text-align: center;
        }

        .confirmation-content {
            max-width: 620px;
        }

        .confirmation-content h1 {
            margin-bottom: 24px;
        }

        .confirmation-content p {
            line-height: 1.8;
            margin-bottom: 18px;
        }

        .confirmation-link {
            display: inline-block;
            margin-top: 24px;
            color: #BCA47A;
            text-decoration: none;
            border-bottom: 1px solid #BCA47A;
            padding-bottom: 5px;
        }
    </style>
</head>
<body>
    <main class="confirmation-page">
        <div class="confirmation-content">
            <h1>Thank You for Subscribing.</h1>

            <p>
                Please check your inbox for an email from EASYBLACK
                and click the confirmation link to complete your subscription.
            </p>

            <p>
                If you don't see the email, check your spam or junk folder.
            </p>

            <a class="confirmation-link" href="index.html">
                Return to EASYBLACK
            </a>
        </div>
    </main>
</body>
</html>
